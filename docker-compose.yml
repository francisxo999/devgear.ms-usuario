services:
  db-usuario:
    image: mysql:8.0
    container_name: mysql-usuario
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: usuario_db
    ports:
      - "3308:3306"
    volumes:
      - db_usuario_data:/var/lib/mysql

  app-usuario:
    build: .
    container_name: devgear-ms-usuario-1
    restart: always
    ports:
      - "8083:8083"
    depends_on:
      - db-usuario
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-usuario:3306/usuario_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

volumes:
  db_usuario_data: